openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: movies
    description: Movie search via TMDB
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /movies/search:
    get:
      operationId: searchMovies
      tags: [movies]
      summary: Search movies on TMDB
      description: Search the TMDB database for movies matching a query string. Returns titles in Brazilian Portuguese when available, plus the original title.
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
            minLength: 1
          description: Movie title to search for
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MovieSearchResult"
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Upstream TMDB error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MovieSearchResult:
      type: object
      properties:
        tmdbId:
          type: integer
          description: TMDB unique movie id
        titlePtBr:
          type: string
          description: Title in Brazilian Portuguese (falls back to original title when no translation exists)
        originalTitle:
          type: string
          description: Original title in the movie's source language
        year:
          type: ["integer", "null"]
          description: Release year
        rating:
          type: ["number", "null"]
          description: TMDB average vote (0-10)
        posterUrl:
          type: ["string", "null"]
          description: Full URL to the movie poster image
      required:
        - tmdbId
        - titlePtBr
        - originalTitle
        - year
        - rating
        - posterUrl
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
