name: Deploy Meus Filmes -> GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "meus-filmes-web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/shutdown-node@v4  # Nota: se usa actions/setup-node@v4 no padrão, ajuste se necessário
        with:
          node-version: 20
          cache: npm
