name: Deploy Meus Filmes -> GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "meus-filmes-web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: meus-filmes-web/package-lock.json

      - name: Instalar dependências
        working-directory: meus-filmes-web
        run: npm install
